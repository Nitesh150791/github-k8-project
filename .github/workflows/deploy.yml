name: CD - GitOps

on:
  workflow_call:
    secrets:
      GITOPS_TOKEN:
        required: true

jobs:
  update-gitops:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Application Repository
        uses: actions/checkout@v7

      - name: Checkout GitOps Repository
        uses: actions/checkout@v7
        with:
          repository: Nitesh150791/gitops-repo
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      - name: Update Backend Image
        run: |
          sed -i "s|image:.*devboard-backend.*|image: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:${{ github.sha }}|" \
          gitops-repo/backend/deployment.yaml

      - name: Update Frontend Image
        run: |
          sed -i "s|image:.*devboard-frontend.*|image: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:${{ github.sha }}|" \
          gitops-repo/frontend/deployment.yaml

      - name: Commit GitOps Changes
        run: |
          cd gitops-repo

          git config user.name "nitesh150791"

          git config user.email "nmore1507@gmail.com"

          git add .

          git commit -m "Deploy ${{ github.sha }}" || echo "No changes to commit"

          git push
