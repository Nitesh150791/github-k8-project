apiVersion: apps/v1
kind: Deployment
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
      - name: devboard-frontend
        image: niteshmore15/devboard-frontend:b9dd9ddc5e7270b56553564a1c52d7eea28a6834
        ports:
        - containerPort: 4173
        resources:
          requests: # min needed
            cpu: 10m
            memory: 64Mi
          limits: # max usable
            cpu: 250m
            memory: 128Mi


